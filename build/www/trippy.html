<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trippy Arcade</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .arcade {
            position: absolute;
            width: 100px;
            height: 100px;
            background-image: url('https://raw.githubusercontent.com/babymariofan34/Bonziworld-e.-edition/test/build/www/img/arcade_v2.png');
            background-size: cover;
        }
    </style>
</head>
<body>
    <script>
        const numImages = 50; // Number of images
        const images = [];

        for (let i = 0; i < numImages; i++) {
            const img = document.createElement('div');
            img.classList.add('arcade');
            img.style.left = `${Math.random() * 100}vw`;
            img.style.top = `${Math.random() * 100}vh`;
            img.style.animation = `move ${Math.random() * 5 + 5}s linear infinite alternate`;
            document.body.appendChild(img);
            images.push(img);
        }

        const keyframes = `
            @keyframes move {
                to {
                    transform: translate(${Math.random() * 200 - 100}vw, ${Math.random() * 200 - 100}vh) rotate(${Math.random() * 360}deg);
                }
            }
        `;

        const styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.innerText = keyframes;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
